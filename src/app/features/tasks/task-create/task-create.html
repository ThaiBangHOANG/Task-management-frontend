<div class="form-container">
  <div class="page-title">Create Task</div>

  <form (ngSubmit)="createTask()">
    <div>
      <label>Title:</label>
      <input
        type="text"
        [(ngModel)]="task.title"
        name="title"
        required
        minlength="3"
        maxlength="100"
        #titleInput="ngModel"
        placeholder="Enter task title"
      />

      @if (titleInput.invalid && titleInput.touched) {
        <div>Title is required.</div>
      }

      @if (titleInput.errors?.['minlength']) {
        Minimum 3 characters
      }

      @if (titleInput.errors?.['maxlength']) {
        Maximum 100 characters
      }
    </div>

    <br />

    <div class="form-group">
      <label>Description:</label>
      <input type="text" [(ngModel)]="task.description" name="description" />
    </div>

    <br />

    <div class="form-group">
      <label>Status:</label>
      <select [(ngModel)]="task.status" name="status">
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
      </select>
    </div>

    <br />

    <button type="submit" class="primary" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Creating Task...' : 'Create Task' }}
    </button>
    <button type="button" class="secondary" (click)="goBack()">Cancel</button>
  </form>
</div>
