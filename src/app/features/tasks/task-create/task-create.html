<div class="form-container">
  <div class="page-title">{{ 'CREATE_TASK' | translate }}</div>

  <form (ngSubmit)="createTask()">
    <div>
      <label>{{ 'TITLE' | translate }}:</label>
      <input
        type="text"
        [(ngModel)]="task.title"
        name="title"
        required
        minlength="3"
        maxlength="100"
        #titleInput="ngModel"
        placeholder="{{ 'TITLE TASK CREATE' | translate }}"
      />

      @if (titleInput.invalid && titleInput.touched) {
        <div class="error-message">{{ 'TITLE' | translate }}</div>
      }

      @if (titleInput.errors?.['minlength']) {
        <div class="error-message">{{ 'TITLE' | translate }}</div>
      }

      @if (titleInput.errors?.['maxlength']) {
        <div class="error-message">{{ 'TITLE' | translate }}</div>
      }
    </div>

    <br />

    <div class="form-group">
      <label>{{ 'DESCRIPTION' | translate }}:</label>
      <textarea
        [(ngModel)]="task.description"
        name="description"
        rows="4"
        placeholder="{{ 'DESCRIPTION TASK CREATE' | translate }}"
      ></textarea>
    </div>

    <br />

    <div class="form-group">
      <label>{{ 'STATUS' | translate }}:</label>
      <select [(ngModel)]="task.status" name="status">
        <option [ngValue]="0">{{ 'PENDING' | translate }}</option>
        <option [ngValue]="1">{{ 'IN_PROGRESS' | translate }}</option>
        <option [ngValue]="2">{{ 'COMPLETED' | translate }}</option>
      </select>
    </div>

    <br />
    <div class="button-group">
      <button type="submit" class="primary" [disabled]="isSubmitting">
        {{ isSubmitting ? 'CREATING_TASK...' : 'CREATE' | translate }}
      </button>
      <button type="button" class="secondary" (click)="goBack()">{{ 'CANCEL' | translate }}</button>
    </div>
  </form>
</div>
