<div class="form-container">
<div class="page-title">{{ 'UPDATE_TASK' | translate }}</div>

<form (ngSubmit)="updateTask()">

  <div class="form-group">
    <label>{{ 'TITLE' | translate }}</label>
    <input
      type="text"
      [(ngModel)]="task.title"
      name="title"
      required
    >
  </div>

  <div class="form-group">
    <label>{{ 'DESCRIPTION' | translate }}</label>
    <input
      type="text"
      [(ngModel)]="task.description"
      name="description"
    >
  </div>

  <div class="form-group">
    <label>{{ 'STATUS' | translate }} </label>

    <select
      [(ngModel)]="task.status"
      name="status"
    >
      <option [ngValue]="0">{{ 'PENDING' | translate }}</option>
      <option [ngValue]="1">{{ 'IN_PROGRESS' | translate }}</option>
      <option [ngValue]="2">{{ 'COMPLETED' | translate }}</option>
    </select>

  </div>

  <button type="submit" class="primary" [disabled]="isSubmitting">
    {{ isSubmitting ? 'UPDATING_TASK...' : 'UPDATE_TASK' | translate }}
  </button>
  <button
    type="button"
    class="secondary butCancel"
    (click)="goBack()"
  >
    {{ 'CANCEL' | translate }}
  </button>

</form>
</div>
