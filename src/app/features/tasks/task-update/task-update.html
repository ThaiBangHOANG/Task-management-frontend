<div class="form-container">
<div class="page-title">Update Task</div>

<form (ngSubmit)="updateTask()">

  <div class="form-group">
    <label>Title</label>
    <input
      type="text"
      [(ngModel)]="task.title"
      name="title"
      required
    >
  </div>

  <div class="form-group">
    <label>Description</label>
    <input
      type="text"
      [(ngModel)]="task.description"
      name="description"
    >
  </div>

  <div class="form-group">
    <label>Status</label>

    <select
      [(ngModel)]="task.status"
      name="status"
    >
      <option>Pending</option>
      <option>InProgress</option>
      <option>Completed</option>
    </select>

  </div>

  <button type="submit" class="primary" [disabled]="isSubmitting">
    {{ isSubmitting ? 'Updating Task...' : 'Update Task' }}
  </button>
  <button
    type="button"
    class="secondary butCancel"
    (click)="goBack()"
  >
    Cancel
  </button>

</form>
</div>
