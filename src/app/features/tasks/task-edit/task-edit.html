<h2>Edit Task</h2>

<form (ngSubmit)="updateTask()">

  <div>
    <label>Title:</label>
    <input
      type="text"
      [(ngModel)]="task.title"
      name="title"
      required
    />
  </div>

  <br>

  <div>
    <label>Description:</label>
    <input
      type="text"
      [(ngModel)]="task.description"
      name="description"
    />
  </div>

  <br>

  <div>
    <label>Status:</label>
    <select
      [(ngModel)]="task.status"
      name="status"
    >
      <option value="Pending">
        Pending
      </option>

      <option value="Completed">
        Completed
      </option>
    </select>
  </div>

  <br>

  <button type="submit">
    Update Task
  </button>

</form>
