<div class="form-container">
  <div class="page-title">{{ 'EDIT_TASK' | translate }}</div>

  <form (ngSubmit)="updateTask()">
    <div>
      <label>{{ 'TITLE' | translate }}:</label>
      <input type="text" [(ngModel)]="task.title" name="title" required />
    </div>

    <div class="form-group">
      <label>{{ 'DESCRIPTION' | translate }}:</label>
      <textarea
        [(ngModel)]="task.description"
        name="description"
        rows="4"
        placeholder="{{ 'DESCRIPTION TASK CREATE' | translate }}"
      ></textarea>
    </div>

    <div class="form-group">
      <label>{{ 'STATUS' | translate }}:</label>
      <select [(ngModel)]="task.status" name="status">
        <option [ngValue]="0">{{ 'PENDING' | translate }}</option>
        <option [ngValue]="1">{{ 'IN_PROGRESS' | translate }}</option>
        <option [ngValue]="2">{{ 'COMPLETED' | translate }}</option>
      </select>
    </div>

    <div class="button-group">
  <button
    type="submit"
    class="primary"
    [disabled]="isSubmitting"
  >
    {{
      isSubmitting
        ? ('UPDATING_TASK...' | translate)
        : ('UPDATE_TASK' | translate)
    }}
  </button>

  <button
    type="button"
    class="secondary"
    (click)="goBack()"
  >
    {{ 'CANCEL' | translate }}
  </button>
</div>
  </form>
</div>
